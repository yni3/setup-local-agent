name: Configure setup-local-agent tools
description: Configure the current Windows or macOS runner with the tools used by setup-local-agent.
author: setup-local-agent contributors

runs:
  using: composite
  steps:
    - name: Configure Windows runner
      if: runner.os == 'Windows'
      shell: cmd
      run: call "${{ github.action_path }}\configure-windows.bat"

    - name: Configure macOS runner
      if: runner.os == 'macOS'
      shell: bash
      run: bash "${{ github.action_path }}/configure-macos.sh"

    - name: Skip unsupported runner
      if: runner.os != 'Windows' && runner.os != 'macOS'
      shell: bash
      run: echo "Skipping setup-local-agent configuration because this runner is $RUNNER_OS."
